app            = "bucketeer-nginx"
primary_region = "sin"

[build]
  image = "registry.fly.io/bucketeer-nginx:latest"

[env]
  WEB_HOST   = "bucketeer-web.internal"
  API_HOST   = "bucketeer-api.internal"
  BATCH_HOST = "bucketeer-batch.internal"
  # TLS_CERT and TLS_KEY set as secrets by deploy.sh

[[services]]
  internal_port        = 80
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  [[services.ports]]
    port     = 80
    handlers = []

[[services]]
  internal_port        = 443
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  [[services.ports]]
    port     = 443
    handlers = []

[vm]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"

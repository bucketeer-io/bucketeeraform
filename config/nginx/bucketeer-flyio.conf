# Fly.io nginx config: runtime DNS via Fly internal resolver (fdaa::3)

resolver [fdaa::3] valid=10s;

map $http_content_type $is_grpc_web {
    ~*application/grpc-web 1;
    default 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # CORS for gRPC-Web
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, x-grpc-web, authorization, grpc-timeout' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Encoding, grpc-message, grpc-status, grpc-status-details-bin' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 10m;

    # ---------- Health ----------
    location /health {
        set $backend "${WEB_HOST}:8000";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API SDK routes ----------
    location /bucketeer.gateway.Gateway {
        set $backend "${API_HOST}:9090";
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s;
        grpc_send_timeout 60s;
        grpc_read_timeout 60s;
    }

    location /v1/gateway {
        set $backend "${API_HOST}:8000";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- Web gRPC / gRPC-Web service routes ----------

    location /bucketeer.account.AccountService {
        set $backend "${WEB_HOST}:9091";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_account; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_account {
        set $backend "${WEB_HOST}:9091";
        proxy_pass https://$backend;
    }

    location /bucketeer.auth.AuthService {
        set $backend "${WEB_HOST}:9092";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_auth; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_auth {
        set $backend "${WEB_HOST}:9092";
        proxy_pass https://$backend;
    }

    location /bucketeer.auditlog.AuditLogService {
        set $backend "${WEB_HOST}:9093";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_auditlog; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_auditlog {
        set $backend "${WEB_HOST}:9093";
        proxy_pass https://$backend;
    }

    location /bucketeer.autoops.AutoOpsService {
        set $backend "${WEB_HOST}:9094";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_autoops; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_autoops {
        set $backend "${WEB_HOST}:9094";
        proxy_pass https://$backend;
    }

    location /hook {
        set $backend "${WEB_HOST}:9094";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s; proxy_send_timeout 15s; proxy_read_timeout 15s;
    }

    location /bucketeer.environment.EnvironmentService {
        set $backend "${WEB_HOST}:9095";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_environment; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s; grpc_send_timeout 60s; grpc_read_timeout 60s;
    }
    location @grpc_web_environment {
        set $backend "${WEB_HOST}:9095";
        proxy_pass https://$backend;
    }

    location /bucketeer.eventcounter.EventCounterService {
        set $backend "${WEB_HOST}:9096";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_eventcounter; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s; grpc_send_timeout 1800s; grpc_read_timeout 1800s;
    }
    location @grpc_web_eventcounter {
        set $backend "${WEB_HOST}:9096";
        proxy_pass https://$backend;
    }

    location /bucketeer.experiment.ExperimentService {
        set $backend "${WEB_HOST}:9097";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_experiment; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s; grpc_send_timeout 60s; grpc_read_timeout 60s;
    }
    location @grpc_web_experiment {
        set $backend "${WEB_HOST}:9097";
        proxy_pass https://$backend;
    }

    location /bucketeer.feature.FeatureService {
        set $backend "${WEB_HOST}:9098";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_feature; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s; grpc_send_timeout 60s; grpc_read_timeout 60s;
    }
    location @grpc_web_feature {
        set $backend "${WEB_HOST}:9098";
        proxy_pass https://$backend;
    }

    location /bucketeer.notification.NotificationService {
        set $backend "${WEB_HOST}:9100";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_notification; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_notification {
        set $backend "${WEB_HOST}:9100";
        proxy_pass https://$backend;
    }

    location /bucketeer.push.PushService {
        set $backend "${WEB_HOST}:9101";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_push; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_push {
        set $backend "${WEB_HOST}:9101";
        proxy_pass https://$backend;
    }

    location /bucketeer.tag.TagService {
        set $backend "${WEB_HOST}:9104";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_tag; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_tag {
        set $backend "${WEB_HOST}:9104";
        proxy_pass https://$backend;
    }

    location /bucketeer.coderef.CodeReferenceService {
        set $backend "${WEB_HOST}:9105";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_coderef; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_coderef {
        set $backend "${WEB_HOST}:9105";
        proxy_pass https://$backend;
    }

    location /bucketeer.team.TeamService {
        set $backend "${WEB_HOST}:9107";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_team; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location @grpc_web_team {
        set $backend "${WEB_HOST}:9107";
        proxy_pass https://$backend;
    }

    location /bucketeer.batch.BatchService {
        set $backend "${BATCH_HOST}:9000";
        if ($is_grpc_web = 1) { error_page 418 = @grpc_web_batch; return 418; }
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 60s; grpc_send_timeout 3600s; grpc_read_timeout 3600s;
    }
    location @grpc_web_batch {
        set $backend "${BATCH_HOST}:9000";
        proxy_pass https://$backend;
    }

    # Web gRPC Gateway REST API
    location /v1/ {
        set $backend "${WEB_HOST}:9089";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s; proxy_send_timeout 60s; proxy_read_timeout 60s;
    }

    location /webhook {
        set $backend "${WEB_HOST}:9089";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s; proxy_send_timeout 60s; proxy_read_timeout 60s;
    }

    # Web dashboard (catch-all)
    location / {
        set $backend "${WEB_HOST}:9103";
        proxy_pass https://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s; proxy_send_timeout 15s; proxy_read_timeout 15s;
    }
}

# Internal gRPC proxy on port 443 (web service connects here with WithBlock)
# Web's gRPC clients use WithBlock() and are created BEFORE its own servers start.
# Routing through nginx lets the TCP handshake succeed immediately (nginx is listening),
# while the actual gRPC call is proxied to the backend once it's ready.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /bucketeer.account.AccountService {
        set $backend "${WEB_HOST}:9091";
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location /bucketeer.auth.AuthService {
        set $backend "${WEB_HOST}:9092";
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location /bucketeer.auditlog.AuditLogService {
        set $backend "${WEB_HOST}:9093";
        grpc_pass grpcs://$backend;
        grpc_connect_timeout 15s; grpc_send_timeout 15s; grpc_read_timeout 15s;
    }
    location /bucketeer.autoops.AutoOpsService {
